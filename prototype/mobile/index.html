<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>智格换电 · 骑手端流程原型</title>
  <style>
    :root {
      --blue: #2f6bff; --blue-dark: #1a4fd6; --gold: #e8c9a0; --gold-text: #8b6914;
      --bg: #f4f6f8; --text: #1a2233; --muted: #8a94a6; --border: #e8ecf0; --danger: #e34d4d;
      --frame-w: 220px; --frame-h: 420px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #e8ecf2; color: var(--text); min-height: 100vh; }
    .flow-header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
    .flow-header h1 { font-size: 18px; font-weight: 700; }
    .flow-header p { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .flow-header nav { display: flex; gap: 12px; font-size: 13px; flex-shrink: 0; }
    .flow-header a { color: var(--blue); text-decoration: none; }
    .flow-board { padding: 20px 24px 48px; overflow-x: auto; }
    .flow-section { background: #fff; border-radius: 16px; padding: 20px 20px 28px; margin-bottom: 24px; box-shadow: 0 4px 24px rgba(15,23,42,.06); }
    .flow-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    .flow-section h2 .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 6px; background: #eef3ff; color: var(--blue); }
    .flow-section h3 { font-size: 13px; font-weight: 600; margin: 18px 0 10px; color: var(--text); }
    .flow-section .section-desc { font-size: 12px; color: var(--muted); margin-bottom: 18px; line-height: 1.6; }
    .flow-track { display: flex; align-items: flex-start; gap: 0; overflow-x: auto; padding-bottom: 8px; min-height: calc(var(--frame-h) + 56px); }
    .flow-cell { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; width: calc(var(--frame-w) + 8px); }
    .frame-label { font-size: 11px; font-weight: 700; color: var(--blue); margin-bottom: 6px; text-align: center; line-height: 1.35; min-height: 30px; }
    .frame-label .step-id { display: block; font-size: 10px; color: var(--muted); font-weight: 600; }
    .frame-hint { margin-top: 6px; color: var(--muted); font-weight: 400; font-size: 9px; min-height: auto; text-align: center; line-height: 1.4; max-width: var(--frame-w); }
    .phone-frame { width: var(--frame-w); height: var(--frame-h); border-radius: 20px; overflow: hidden; box-shadow: 0 8px 28px rgba(15,23,42,.14); background: #fff; border: 2px solid #fff; display: flex; flex-direction: column; }
    .phone-frame.highlight { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(47,107,255,.2), 0 8px 28px rgba(15,23,42,.14); }
    .phone-frame.wireframe { border: 2px dashed #c5cad3; background: #fafbfc; display: grid; place-items: center; color: var(--muted); min-height: var(--frame-h); }
    .phone-frame.wireframe .wf-x { font-size: 48px; opacity: .25; }
    .phone-frame.wireframe .wf-text { font-size: 13px; font-weight: 600; margin-top: 8px; text-align: center; padding: 0 12px; }
    .status-bar { display: flex; justify-content: space-between; padding: 4px 10px 2px; font-size: 10px; font-weight: 600; background: #fff; flex-shrink: 0; }
    .app-header { text-align: center; font-size: 13px; font-weight: 600; padding: 4px 0 6px; background: #fff; flex-shrink: 0; }
    .service-banner { background: #fffbe8; color: #7a6520; font-size: 9px; text-align: center; padding: 4px 8px; flex-shrink: 0; }
    .screen-body { flex: 1; overflow: hidden; background: var(--bg); font-size: 10px; line-height: 1.45; position: relative; }
    .tab-bar { display: flex; background: #fff; border-top: 1px solid var(--border); flex-shrink: 0; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 5px 0 4px; font-size: 9px; color: var(--muted); }
    .tab-item.active { color: var(--blue); font-weight: 600; }
    .tab-item .icon { font-size: 14px; line-height: 1; margin-bottom: 1px; }
    .sub-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .sub-tab { flex: 1; padding: 8px 0; font-size: 10px; color: var(--muted); text-align: center; position: relative; }
    .sub-tab.active { color: var(--blue); font-weight: 600; }
    .sub-tab.active::after { content: ""; position: absolute; left: 20%; right: 20%; bottom: 0; height: 2px; background: var(--blue); }
    .map-area { height: 100%; position: relative; background: linear-gradient(180deg, #dce8f5, #d4e4d0); }
    .map-area::before { content: ""; position: absolute; inset: 0; opacity: .35; background-image: linear-gradient(#b8c8d8 1px, transparent 1px), linear-gradient(90deg, #b8c8d8 1px, transparent 1px); background-size: 32px 32px; }
    .map-pin { position: absolute; width: 18px; height: 22px; transform: translate(-50%, -100%); }
    .map-pin::before { content: ""; position: absolute; left: 50%; bottom: 0; width: 6px; height: 6px; background: var(--blue); border-radius: 50%; transform: translateX(-50%); box-shadow: 0 0 0 3px rgba(47,107,255,.25); }
    .map-pin.dedicated::before { background: #1677ff; }
    .map-pin::after { content: ""; position: absolute; left: 50%; top: 0; width: 14px; height: 14px; background: var(--danger); border-radius: 50% 50% 50% 0; transform: translateX(-50%) rotate(-45deg); border: 1px solid #fff; }
    .map-pin.dedicated::after { background: #1677ff; }
    .map-legend { position: absolute; left: 8px; bottom: 52px; font-size: 8px; color: var(--muted); background: rgba(255,255,255,.92); padding: 4px 6px; border-radius: 4px; max-width: 120px; line-height: 1.4; }
    .map-fab-row { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; align-items: flex-end; justify-content: center; gap: 8px; padding: 0 10px; }
    .fab-circle { width: 28px; height: 28px; border-radius: 50%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.12); border: none; font-size: 12px; display: grid; place-items: center; }
    .fab-scan { flex: 1; max-width: 120px; height: 32px; border-radius: 16px; background: var(--blue); color: #fff; border: none; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 4px; box-shadow: 0 2px 10px rgba(47,107,255,.35); }
    .login-hero { padding: 28px 16px 20px; text-align: center; background: #fff; }
    .logo { width: 48px; height: 48px; border-radius: 50%; margin: 0 auto 10px; background: linear-gradient(135deg, #1a2233, #3d4f6f); display: grid; place-items: center; color: #fff; font-size: 18px; font-weight: 800; }
    .login-hero h3 { font-size: 16px; margin-bottom: 6px; }
    .login-hero p { color: var(--muted); font-size: 10px; margin-bottom: 16px; }
    .btn-login { width: 100%; height: 34px; border-radius: 17px; background: var(--blue); color: #fff; border: none; font-size: 12px; font-weight: 600; }
    .agree-row { display: flex; gap: 6px; align-items: flex-start; margin-top: 12px; font-size: 9px; color: var(--muted); text-align: left; }
    .profile-head { display: flex; align-items: center; padding: 10px; background: #fff; gap: 8px; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #e8ecf0; display: grid; place-items: center; font-size: 14px; }
    .profile-head .phone { font-size: 13px; font-weight: 600; }
    .tag-sm { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px; background: #f0f2f5; color: var(--muted); margin-left: 4px; }
    .tag-sm.ok { background: #e6f7ee; color: #1a8f4a; }
    .service-card { margin: 8px 10px; padding: 12px 10px; border-radius: 10px; background: linear-gradient(135deg, #3d7bff, #1a4fd6); color: #fff; min-height: 64px; position: relative; overflow: hidden; }
    .service-card::after { content: "⚡"; position: absolute; right: 8px; bottom: -6px; font-size: 40px; opacity: .15; }
    .service-card h4 { font-size: 12px; margin-bottom: 4px; }
    .service-card p { font-size: 9px; opacity: .92; line-height: 1.45; }
    .service-card.warn { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .service-card.channel { background: linear-gradient(135deg, #6366f1, #4f46e5); }
    .service-card.done { background: linear-gradient(135deg, #8a94a6, #5c6575); }
    .btn-gold { display: inline-block; margin-top: 8px; background: var(--gold); color: var(--gold-text); border: none; padding: 6px 12px; border-radius: 14px; font-size: 10px; font-weight: 600; }
    .service-scope-banner { margin: 0 10px 8px; padding: 8px 10px; border-radius: 8px; background: #ecfdf5; border: 1px solid #99f6e4; font-size: 9px; color: #0f766e; line-height: 1.45; }
    .service-scope-banner strong { color: #115e59; }
    .channel-attr-banner { background: linear-gradient(90deg, #fff7e6, #fff); border: 1px solid #ffd666; border-radius: 8px; padding: 8px; font-size: 9px; line-height: 1.5; color: #7a6520; margin: 0 10px 8px; }
    .section-card { margin: 0 10px 8px; background: #fff; border-radius: 10px; padding: 10px 8px; }
    .section-title { font-size: 11px; font-weight: 600; margin-bottom: 8px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .grid-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 8px; color: var(--text); }
    .grid-item .gi { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 14px; background: #eef3ff; color: var(--blue); }
    .deposit-status-card { margin: 0 10px 8px; padding: 10px; background: #fff; border-radius: 10px; font-size: 9px; line-height: 1.5; border: 1px solid var(--border); }
    .deposit-status-card .ds-title { font-weight: 600; margin-bottom: 3px; font-size: 10px; }
    .sheet-page { padding: 10px; background: #fff; height: 100%; overflow: hidden; }
    .form-row { margin-bottom: 10px; }
    .form-row label { display: block; font-size: 10px; color: var(--muted); margin-bottom: 4px; }
    .form-row input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 11px; }
    .btn-block { width: 100%; height: 32px; border-radius: 16px; border: none; background: var(--blue); color: #fff; font-size: 11px; font-weight: 600; }
    .pkg-card { border: 1px solid var(--blue); border-radius: 8px; padding: 10px; margin-bottom: 8px; background: #f8faff; }
    .pkg-card h5 { font-size: 11px; margin-bottom: 2px; }
    .pkg-card .price { color: var(--danger); font-size: 14px; font-weight: 700; }
    .pkg-card .desc { font-size: 9px; color: var(--muted); margin-top: 2px; }
    .deposit-block { margin-top: 8px; padding: 8px; border-radius: 8px; background: #f8fafc; border: 1px solid var(--border); }
    .deposit-block h5 { font-size: 10px; margin-bottom: 6px; }
    .deposit-opt { display: flex; gap: 8px; padding: 7px 8px; border: 1.5px solid var(--border); border-radius: 6px; margin-bottom: 6px; background: #fff; font-size: 9px; }
    .deposit-opt.selected { border-color: var(--blue); background: #f8faff; }
    .deposit-opt .opt-title { font-weight: 600; font-size: 10px; }
    .pay-summary { margin-top: 8px; padding: 8px; background: #fff; border-radius: 6px; border: 1px dashed var(--border); font-size: 10px; line-height: 1.6; }
    .pay-summary .total { font-size: 13px; font-weight: 700; color: var(--danger); }
    .op-pick-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; font-size: 10px; }
    .op-pick-item small { color: var(--muted); display: block; margin-top: 2px; font-size: 9px; }
    .scan-box { text-align: center; padding: 16px 10px; }
    .scan-frame { width: 110px; height: 110px; margin: 0 auto 10px; border: 2px solid var(--blue); border-radius: 8px; background: #111; position: relative; }
    .scan-line { position: absolute; left: 6px; right: 6px; height: 2px; background: var(--blue); top: 30%; box-shadow: 0 0 6px var(--blue); }
    .result-ok { text-align: center; padding: 14px 10px; }
    .result-ok .big { font-size: 32px; margin-bottom: 8px; color: #1a8f4a; }
    .result-ok .big.fail { color: var(--danger); }
    .result-ok h4 { font-size: 12px; margin-bottom: 6px; }
    .result-ok p { font-size: 9px; color: var(--muted); line-height: 1.55; }
    .order-list { padding: 8px 10px; }
    .order-card { background: #fff; border-radius: 8px; padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .order-card .top { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 10px; font-weight: 600; }
    .order-card .status { color: var(--blue); font-size: 9px; }
    .order-card .meta { font-size: 9px; color: var(--muted); line-height: 1.5; }
    .empty { text-align: center; padding: 36px 16px; color: var(--muted); font-size: 11px; }
    .empty .icon { font-size: 36px; margin-bottom: 8px; opacity: .4; }
    .toast-block { margin: 20px 12px; padding: 12px; background: rgba(0,0,0,.78); color: #fff; border-radius: 8px; font-size: 10px; text-align: center; line-height: 1.5; }
    .flow-connector { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 52px; padding-top: 36px; align-self: flex-start; }
    .arrow-h { width: 36px; height: 3px; background: var(--blue); position: relative; border-radius: 2px; }
    .arrow-h::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 7px solid var(--blue); }
    .connector-label { font-size: 9px; color: var(--blue); font-weight: 600; margin-top: 5px; text-align: center; line-height: 1.3; max-width: 48px; }
    .flow-branch-area { margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--border); display: flex; gap: 20px; flex-wrap: wrap; align-items: flex-start; }
    .flow-note { flex: 1; min-width: 240px; max-width: 480px; background: #eef6ff; border: 1px solid #b3d4ff; border-radius: 12px; padding: 14px 16px; font-size: 11px; line-height: 1.65; color: #1a3a6b; }
    .flow-note h4 { font-size: 12px; margin-bottom: 8px; color: var(--blue-dark); }
    .flow-note ul { padding-left: 16px; margin-top: 6px; }
    .branch-v-connector { display: flex; flex-direction: column; align-items: center; margin-bottom: 4px; }
    .arrow-v { width: 3px; height: 28px; background: var(--blue); position: relative; border-radius: 2px; }
    .arrow-v::after { content: ""; position: absolute; bottom: -1px; left: -4px; border: 5px solid transparent; border-top: 7px solid var(--blue); }
    .supplement-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--frame-w) + 24px), 1fr)); gap: 16px 12px; }
    .supplement-grid .flow-cell { width: auto; }
    .legend-bar { display: flex; flex-wrap: wrap; gap: 12px 20px; font-size: 11px; color: var(--muted); margin-bottom: 16px; padding: 10px 14px; background: #f8fafc; border-radius: 10px; }
    .legend-bar span::before { content: "●"; margin-right: 4px; color: var(--blue); }
    .legend-bar span.sys::before { content: "◆"; }
    .legend-bar span.warn::before { content: "!"; color: #d97706; }
    .legend-bar span.phase2::before { content: "⋯"; color: #8a94a6; }
    @media (max-width: 720px) { .flow-header { flex-direction: column; align-items: flex-start; } :root { --frame-w: 200px; --frame-h: 380px; } }
  </style>
</head>
<body>
  <header class="flow-header">
    <div>
      <h1>智格换电 · 骑手端流程原型</h1>
      <p>平铺展示 · 箭头串联业务 · 覆盖三 Tab + 主线 + 全部补充场景 · 对齐 <a id="navDocsLink" href="../docs/index.html">骑手端 PRD</a></p>
    </div>
    <nav><a href="../index.html">← 运营商后台</a><a id="navDocsLink2" href="../docs/index.html">产品文档</a></nav>
  </header>
  <main class="flow-board" id="flowBoard"></main>
  <script>
    const OP = { "OP-SX": "绿色出行", "OP-LJZ": "陆家嘴联营", "OP-BJ": "滨江换电" };

    const MAINLINE = {
      personal: { story: "personal", steps: [
        { id: "P01", title: "登录授权" }, { id: "P02", title: "实名认证" }, { id: "P03", title: "确定服务运营商" },
        { id: "P04", title: "购买套餐" }, { id: "P05", title: "首次领取电池" }, { id: "P06", title: "日常换电" },
        { id: "P07", title: "续费" }, { id: "P08", title: "冻结与解冻" }, { id: "P09", title: "退款/退租/完结" }
      ]},
      channel: { story: "channel", steps: [
        { id: "C01", title: "登录授权" }, { id: "C02", title: "权益到账" }, { id: "C03", title: "今日预占" },
        { id: "C04", title: "首次领取电池" }, { id: "C05", title: "日常换电与确认消耗" }, { id: "C06", title: "额度异常·仅还电" },
        { id: "C07", title: "离职/移除" }, { id: "C08", title: "还电与回池完结" }
      ]}
    };

    function phoneShell(title, tab, body, opts = {}) {
      const tabs = [{ id: "home", label: "首页", icon: "⌂" }, { id: "orders", label: "订单", icon: "☰" }, { id: "mine", label: "我的", icon: "☺" }];
      const tabHtml = opts.hideTab ? "" : `<nav class="tab-bar">${tabs.map(t => `<div class="tab-item${t.id === tab ? " active" : ""}"><span class="icon">${t.icon}</span>${t.label}</div>`).join("")}</nav>`;
      if (opts.wireframe) return `<div class="phone-frame wireframe${opts.highlight ? " highlight" : ""}"><div class="wf-x">✕</div><div class="wf-text">${opts.wireframeText || title}</div></div>`;
      return `<div class="phone-frame${opts.highlight ? " highlight" : ""}">
        <div class="status-bar"><span>11:24</span><span>5G ▮▮▮</span></div>
        <div class="app-header">${title}</div><div class="service-banner">客服 400-607-2666 · 8:00-24:00</div>
        <div class="screen-body">${body}</div>${tabHtml}</div>`;
    }
    function ordersShell(subTab, listHtml) {
      return phoneShell("订单", "orders", `
        <div class="sub-tabs">
          <div class="sub-tab${subTab === "swap" ? " active" : ""}">换电订单</div>
          <div class="sub-tab${subTab === "purchase" ? " active" : ""}">服务购买</div>
          <div class="sub-tab${subTab === "return" ? " active" : ""}">退租订单</div>
        </div><div class="order-list">${listHtml}</div>`);
    }
    function connector(label) { return `<div class="flow-connector"><div class="arrow-h"></div>${label ? `<span class="connector-label">${label}</span>` : ""}</div>`; }
    function flowCell(id, title, html, hint) {
      return `<div class="flow-cell" data-step="${id}"><div class="frame-label"><span class="step-id">${id}</span>${title}</div>${html}${hint ? `<div class="frame-hint">${hint}</div>` : ""}</div>`;
    }

    const SCREENS = {
      home: () => phoneShell("首页", "home", `
        <div class="map-area">
          <div class="map-pin" style="left:42%;top:48%"></div><div class="map-pin" style="left:58%;top:62%"></div>
          <div class="map-legend">图例：蓝钉=可换电站 · 扫一扫换电</div>
          <div class="map-fab-row"><button class="fab-circle">?</button><button class="fab-scan">⊞ 扫一扫</button><button class="fab-circle">⌖</button></div>
        </div>`),
      homeDedicated: () => phoneShell("首页", "home", `
        <div class="map-area">
          <div class="map-pin" style="left:42%;top:48%"></div><div class="map-pin dedicated" style="left:36%;top:56%"></div>
          <div class="map-legend">图例：含 1 个渠道专属站（白名单）</div>
          <div class="map-fab-row"><button class="fab-scan">⊞ 扫一扫</button></div>
        </div>`),
      ordersSwap: () => ordersShell("swap", `
        <div class="order-card"><div class="top"><span>SW2605241201</span><span class="status">成功</span></div>
          <div class="meta">浦东骑手驿站<br>2026-05-24 12:05<br>权益：个人套餐</div></div>
        <div class="order-card"><div class="top"><span>SW2605241188</span><span class="status">成功</span></div>
          <div class="meta">浦东骑手驿站<br>2026-05-24 08:30<br>权益：个人套餐</div></div>`),
      ordersPurchase: () => ordersShell("purchase", `
        <div class="order-card"><div class="top"><span>SUB260524001</span><span class="status">已支付</span></div>
          <div class="meta">30天畅换 · ¥398<br>套餐 ¥299 + 押金 ¥99（实付·在押）<br>服务：绿色出行 · 2026-05-01</div></div>`),
      ordersReturn: () => ordersShell("return", `<div class="empty"><div class="icon">📋</div>暂无退租记录</div>`),
      ordersEmptySwap: () => ordersShell("swap", `<div class="empty"><div class="icon">🔋</div>暂无换电记录</div>`),
      login: () => phoneShell("我的", "mine", `
        <div class="login-hero"><div class="logo">智</div><h3>智格换电</h3><p>安全出行 放心骑行</p>
          <button class="btn-login">微信一键登录</button>

        connector(""), flowCell("C04b", "扫码领取", SCREENS.scanPickup(), "● 出电"),
        connector(""), flowCell("C04c", "领取成功", SCREENS.resultPickup(), "● 押金已办结"),
        connector(""), flowCell("C05", "换电确认消耗", SCREENS.resultSwap(true), "◆ 今日已确认"),
        connector(""), flowCell("C06", "额度异常", SCREENS.mineChannelFail(), "! channel_fail"),
        connector(""), flowCell("C06b", "仅可还电", SCREENS.scanReturnOnly(), "! 禁止换电"),
        connector(""), flowCell("C07", "离职终止", SCREENS.mineResigned(), "■ channel_resign"),
        connector(""), flowCell("C08", "还电回池", SCREENS.resultReturn(), "◆ 不回款骑手")
      ].join("");
    }

    const SUPPLEMENT_PERSONAL = [
      { id: "SP-01", title: "定位两 OP 接近", key: "geo_ambiguous", fn: () => SCREENS.mineGeoAmbiguous() },
      { id: "SP-02", title: "定位拒绝", key: "geo_denied", fn: () => SCREENS.geoDenied() },
      { id: "SP-03", title: "附近无站", key: "geo_no_nearby", fn: () => SCREENS.geoNoNearby() },
      { id: "SP-04", title: "个人跨网·案例3", key: "personal_cross3", fn: () => SCREENS.failCrossNet() },
      { id: "SP-05", title: "支付失败", key: "payment_fail", fn: () => SCREENS.wirePaymentFail() },
      { id: "SP-06", title: "柜机超时/无空电", key: "cabinet_timeout", fn: () => SCREENS.wireCabinetTimeout() },
      { id: "SP-07", title: "解冻待领电池", key: "pending_pickup", fn: () => SCREENS.minePendingPickup() },
      { id: "SP-08", title: "冷静期退款", key: "cooling_refund", fn: () => SCREENS.mineCooling() },
      { id: "SP-09", title: "订单空态", key: "orders_empty", fn: () => SCREENS.ordersEmptySwap() }
    ];
    const SUPPLEMENT_CHANNEL = [
      { id: "SC-01", title: "押金已办·持电池", key: "channel_deposit_done", fn: () => SCREENS.mineChannel({ confirmed: true, today: "今日已确认消耗" }) },
      { id: "SC-02", title: "预占失败·待还电", key: "channel_fail", fn: () => SCREENS.mineChannelFail() },
      { id: "SC-03", title: "个人无额度·待还电", key: "channel_no_quota", fn: () => SCREENS.mineChannelNoQuota() },
      { id: "SC-04", title: "渠道跨网·案例3", key: "channel_cross3", fn: () => SCREENS.failCrossNet() },
      { id: "SC-05", title: "离职还电回池", key: "channel_resign", fn: () => SCREENS.mineResigned() }
    ];
    const SUPPLEMENT_PHASE2 = [
      { id: "S2-01", title: "设备租赁·付费已购", key: "lease_whitelist", fn: () => SCREENS.mineLeasePaid() },
      { id: "S2-02", title: "设备租赁·付费未购", key: "lease_whitelist_new", fn: () => SCREENS.mineLeaseNew() },
      { id: "S2-03", title: "设备租赁·白名单免费", key: "lease_whitelist_free", fn: () => SCREENS.mineLeaseFree() },
      { id: "S2-04", title: "渠道停服·持电池", key: "lease_suspended", fn: () => SCREENS.mineLeaseSuspended() },
      { id: "S2-05", title: "渠道停服·未持电池", key: "lease_suspended_nobat", fn: () => SCREENS.failSuspended() },
      { id: "S2-06", title: "非白名单拦截", key: "lease_blocked", fn: () => SCREENS.mineLeaseBlocked() },
      { id: "S2-07", title: "专属站地图", key: "lease_map", fn: () => SCREENS.homeDedicated() },
      { id: "S2-08", title: "白名单未购扫码", key: "lease_pkg_required", fn: () => SCREENS.failLeasePkg() },
      { id: "S2-09", title: "扫专属站拦截", key: "lease_whitelist_block", fn: () => SCREENS.failWhitelist() },
      { id: "S2-10", title: "骑士卡·未登录", key: "card_link_guest", fn: () => SCREENS.loginCardLink() },
      { id: "S2-11", title: "骑士卡·未实名", key: "card_link_kyc", fn: () => SCREENS.kyc() },
      { id: "S2-12", title: "骑士卡·专享价", key: "card_link_attr", fn: () => SCREENS.purchaseCardAttr() },
      { id: "S2-13", title: "骑士卡·再次购卡", key: "card_link_rebuy", fn: () => SCREENS.purchaseCardRebuy() }
    ];

    function buildSupplementGrid(items, phase2) {
      return items.map(s => flowCell(s.id, (phase2 ? "⋯ " : "") + s.title, s.fn(), s.key + (phase2 ? " · 二期" : ""))).join("");
    }

    function renderFlowBoard() {
      document.getElementById("flowBoard").innerHTML = `
        <div class="legend-bar">
          <span>用户操作</span><span class="sys">系统自动</span><span class="warn">警告/阻断</span><span class="phase2">二期</span>
        </div>
        <section class="flow-section"><h2>信息架构 · 三 Tab 基础页 <span class="badge">IA</span></h2>
          <p class="section-desc">首页地图 + 订单三 Tab（换电/服务购买/退租）+ 我的服务态 + 设置。个人与人天共用 Tab 结构；渠道人天通常无自购套餐单。</p>
          <div class="flow-track">${buildIATrack()}</div></section>
        <section class="flow-section"><h2>主线一 · 个人套餐 <span class="badge">P01–P09</span></h2>
          <p class="section-desc">登录 → 实名 → 定 OP → 购套餐 → 待领电 → 扫码领取 → 换电 → 续费 → 冻结/解冻 → 冷静期退款。</p>
          <div class="flow-track">${buildPersonalTrack()}</div>${buildPersonalBranch()}</section>
        <section class="flow-section"><h2>主线二 · 渠道人天 <span class="badge">C01–C08</span></h2>
          <p class="section-desc">权益到账 → 预占 → 首领押金 → 领电 → 换电确认消耗 → 额度异常仅还电 → 离职 → 还电回池。无主套餐入口，无自费兜底。</p>
          <div class="flow-track">${buildChannelTrack()}</div>
          <div class="flow-note" style="margin-top:16px"><h4>渠道 vs 个人 · 互斥</h4>
            <p>不可同时持有个人套餐与渠道人天；零额度持电池<strong>仅可还电</strong>，须联系渠道续配。</p></div></section>
        <section class="flow-section"><h2>补充场景 · 个人 / 定位 <span class="badge">一期</span></h2>
          <div class="supplement-grid">${buildSupplementGrid(SUPPLEMENT_PERSONAL, false)}</div></section>
        <section class="flow-section"><h2>补充场景 · 渠道人天 <span class="badge">一期</span></h2>
          <div class="supplement-grid">${buildSupplementGrid(SUPPLEMENT_CHANNEL, false)}</div></section>
        <section class="flow-section"><h2>补充场景 · 二期 <span class="badge">非必测</span></h2>
          <p class="section-desc">设备租赁白名单、骑士卡链接、专属站等。演示身份 key 与验收标准一致。</p>
          <div class="supplement-grid">${buildSupplementGrid(SUPPLEMENT_PHASE2, true)}</div></section>`;
    }

    renderFlowBoard();
    (function () {
      var href = "../documentation/index.html";
      ["navDocsLink", "navDocsLink2"].forEach(function (id) { var el = document.getElementById(id); if (el) el.href = href; });
    })();
  </script>
</body>
</html>
