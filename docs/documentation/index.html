<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品文档 · 骑手换电</title>
  <style>
    :root {
      --bg: #f4f7fb; --surface: #fff; --ink: #17212b; --muted: #657383;
      --line: #dce5ee; --brand: #0d9488; --brand-dark: #0f766e; --brand-soft: #ecfdf5;
      --radius: 8px; --shadow: 0 10px 30px rgba(22, 33, 43, .08);
      --sidebar-w: 260px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; color: var(--ink); background: var(--bg); }
    a { color: var(--brand-dark); }
    .layout { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }
    .sidebar {
      background: #1a2332; color: #e8eef4; padding: 18px 14px; overflow-y: auto;
      position: sticky; top: 0; height: 100vh;
    }
    .sidebar h1 { margin: 0; font-size: 16px; }
    .sidebar .sub { font-size: 12px; color: #9aa8b8; margin: 6px 0 16px; line-height: 1.5; }
    .nav-links { display: grid; gap: 6px; margin-bottom: 18px; }
    .nav-links a {
      display: block; padding: 8px 10px; border-radius: var(--radius); font-size: 13px;
      color: #c5d0dc; text-decoration: none; background: rgba(255,255,255,.04);
    }
    .nav-links a:hover { background: rgba(13, 148, 136, .2); color: #fff; }
    .doc-group { margin-bottom: 14px; }
    .doc-group h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #7b8a9a; }
    .doc-list { display: grid; gap: 4px; }
    .doc-list button {
      border: none; background: transparent; color: #dce5ee; text-align: left;
      padding: 8px 10px; border-radius: var(--radius); font-size: 13px; cursor: pointer; width: 100%;
    }
    .doc-list button:hover { background: rgba(255,255,255,.06); }
    .doc-list button.active { background: rgba(13, 148, 136, .28); color: #fff; font-weight: 600; }
    .main { min-width: 0; padding: 20px 28px 40px; }
    .toolbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      margin-bottom: 16px; font-size: 13px; color: var(--muted);
    }
    .toolbar .file { font-weight: 600; color: var(--ink); }
    .article {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 28px 32px 36px; max-width: 1100px;
    }
    .article .loading, .article .error { color: var(--muted); font-size: 14px; }
    .md h1 { font-size: 26px; margin: 0 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
    .md h2 { font-size: 20px; margin: 28px 0 12px; }
    .md h3 { font-size: 16px; margin: 22px 0 10px; }
    .md p, .md li { font-size: 14px; line-height: 1.75; }
    .md ul, .md ol { padding-left: 1.4em; }
    .md table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 12px 0; }
    .md th, .md td { border: 1px solid var(--line); padding: 8px 10px; text-align: left; }
    .md th { background: var(--brand-soft); }
    .md code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
    .md pre { background: #1e293b; color: #e2e8f0; padding: 14px; border-radius: var(--radius); overflow-x: auto; font-size: 12px; line-height: 1.6; }
    .md pre code { background: none; padding: 0; color: inherit; }
    .md blockquote { margin: 12px 0; padding: 10px 14px; border-left: 4px solid var(--brand); background: var(--brand-soft); color: var(--muted); }
    .md hr { border: none; border-top: 1px solid var(--line); margin: 24px 0; }
    .md .mermaid-wrap {
      margin: 18px 0; padding: 0; background: #fafbfc;
      border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
    }
    .md .mermaid-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap;
      padding: 8px 12px; background: #f1f5f9; border-bottom: 1px solid var(--line);
      font-size: 12px; color: var(--muted);
    }
    .md .mermaid-toolbar .mermaid-title { font-weight: 600; color: var(--ink); max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .md .mermaid-toolbar .mermaid-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .md .mermaid-toolbar button {
      border: 1px solid var(--line); background: #fff; color: var(--ink);
      border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; line-height: 1.3;
    }
    .md .mermaid-toolbar button:hover { border-color: var(--brand); color: var(--brand-dark); background: var(--brand-soft); }
    .md .mermaid-toolbar button:disabled { opacity: .55; cursor: wait; }
    .md .mermaid-toolbar button.primary { background: var(--brand); color: #fff; border-color: var(--brand); }
    .md .mermaid-toolbar button.primary:hover { background: var(--brand-dark); border-color: var(--brand-dark); color: #fff; }
    .md .mermaid-viewport {
      padding: 20px 16px; overflow: auto; max-height: min(72vh, 820px);
      background: #fafbfc; -webkit-overflow-scrolling: touch;
    }
    .md .mermaid-wrap .mermaid { display: inline-block; min-width: 100%; text-align: center; min-height: 40px; }
    /* 不压扁大图：保留矢量原始宽度，横向滚动查看；下载走高清栅格 */
    .md .mermaid-wrap svg { max-width: none; height: auto; display: block; margin: 0 auto; }
    .md .mermaid-error {
      font-size: 12px; color: #c84545; padding: 10px 12px; background: #fff5f5;
      border-radius: 6px; margin: 8px 12px 12px;
    }
    .mermaid-lightbox {
      position: fixed; inset: 0; z-index: 1000; background: rgba(15, 23, 42, .72);
      display: none; flex-direction: column; padding: 16px;
    }
    .mermaid-lightbox.open { display: flex; }
    .mermaid-lightbox .lb-bar {
      display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
      color: #fff; margin-bottom: 10px; font-size: 13px;
    }
    .mermaid-lightbox .lb-bar .lb-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .mermaid-lightbox .lb-bar button {
      border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.12); color: #fff;
      border-radius: 6px; padding: 6px 12px; font-size: 12px; cursor: pointer;
    }
    .mermaid-lightbox .lb-bar button:hover { background: rgba(255,255,255,.22); }
    .mermaid-lightbox .lb-stage {
      flex: 1; min-height: 0; overflow: auto; background: #fff; border-radius: 10px;
      padding: 24px; display: flex; justify-content: flex-start; align-items: flex-start;
    }
    .mermaid-lightbox .lb-stage svg { max-width: none; height: auto; display: block; }
    .md .anchor-flash { animation: anchorFlash 1.2s ease; border-radius: 4px; }
    @keyframes anchorFlash {
      0%, 100% { background: transparent; }
      30% { background: #ecfdf5; box-shadow: inset 3px 0 0 #0d9488; }
    }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1>产品文档</h1>
      <p class="sub">PRD · 业务规则 · 流程图 · 验收标准<br>与原型同步维护</p>
      <div class="nav-links">
        <a href="../index.html">← 运营商后台原型</a>
        <a href="../mobile/index.html">← 骑手端原型</a>
      </div>
      <div id="docNav"></div>
    </aside>
    <main class="main">
      <div class="toolbar">
        <span class="file" id="currentFile">—</span>
        <span id="loadStatus"></span>
      </div>
      <article class="article">
        <div id="content" class="md loading">加载中…</div>
      </article>
    </main>
  </div>

  <script src="vendor/marked.min.js"></script>
  <script src="vendor/mermaid.min.js"></script>
  <script src="../js/doc-catalog.js"></script>
  <script>
    const DOC_GROUPS = DocCatalog.DOC_GROUPS;

    function docFileUrl(file) {
      return DocCatalog.docFileUrlFromDocsPage(file);
    }

    function allDocs() {
      return DocCatalog.allDocs();
    }

    let currentDocFile = "";

    function slugifyHeading(text) {
      return text.trim()
        .replace(/\./g, "")
        .replace(/\s*·\s*/g, "--")
        .replace(/[（(][^）)]*[）)]/g, m => m.replace(/[（()）]/g, ""))
        .replace(/[：:、「」【】]/g, "")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .toLowerCase();
    }

    function addHeadingIds(root) {
      root.querySelectorAll("h1,h2,h3,h4,h5").forEach(h => {
        if (!h.id) h.id = slugifyHeading(h.textContent);
      });
    }

    function scrollToAnchor(root, anchor) {
      if (!anchor) return;
      const id = decodeURIComponent(anchor);
      let el = document.getElementById(id);
      if (!el) {
        el = Array.from(root.querySelectorAll("h1,h2,h3,h4,h5")).find(h =>
          slugifyHeading(h.textContent) === id
        );
      }
      if (el) {
        requestAnimationFrame(() => el.scrollIntoView({ behavior: "smooth", block: "start" }));
        el.classList.add("anchor-flash");
        setTimeout(() => el.classList.remove("anchor-flash"), 1500);
      }
    }

    function parseLocationHash() {
      const raw = decodeURIComponent(location.hash.slice(1) || "");
      if (!raw) return { file: "PRD.md", anchor: "" };
      const match = raw.match(/^(.+?\.md)(?:#(.*))?$/);
      if (match) return { file: match[1], anchor: match[2] || "" };
      return { file: raw.endsWith(".md") ? raw : "PRD.md", anchor: "" };
    }

    function parseFileQuery() {
      try {
        const f = new URLSearchParams(location.search).get("file");
        if (f && f.endsWith(".md")) return decodeURIComponent(f);
      } catch (_) { /* ignore */ }
      return "";
    }

    function resolveDocLink(href, baseFile) {
      if (!href) return null;
      if (/^https?:\/\//i.test(href) || href.startsWith("mailto:")) return null;
      if (href.startsWith("file://") || href.startsWith("/Users/")) return { broken: true };

      let pathPart = href;
      let anchor = "";
      if (href.startsWith("#")) {
        anchor = decodeURIComponent(href.slice(1));
        return anchor ? { file: baseFile, anchor } : null;
      }
      const hashIdx = href.indexOf("#");
      if (hashIdx >= 0) {
        anchor = decodeURIComponent(href.slice(hashIdx + 1));
        pathPart = href.slice(0, hashIdx);
      }
      if (pathPart.startsWith("./")) pathPart = pathPart.slice(2);
      if (!pathPart) return { file: baseFile, anchor };

      if (!pathPart.endsWith(".md")) return null;

      const baseDir = baseFile.includes("/") ? baseFile.replace(/[^/]+$/, "") : "";
      const stack = [];
      for (const seg of (baseDir + pathPart).split("/")) {
        if (!seg || seg === ".") continue;
        if (seg === "..") stack.pop();
        else stack.push(seg);
      }
      return { file: stack.join("/"), anchor };
    }

    function setDocHash(file, anchor, push) {
      const h = anchor ? `${file}#${anchor}` : file;
      if (push) location.hash = h;
      else history.replaceState(null, "", "#" + h);
    }

    function prepareMermaidBlocks(root) {
      root.querySelectorAll("pre code.language-mermaid").forEach((code, idx) => {
        const pre = code.parentElement;
        const wrap = document.createElement("div");
        wrap.className = "mermaid-wrap";
        wrap.dataset.diagramIndex = String(idx + 1);
        const diagram = document.createElement("div");
        diagram.className = "mermaid";
        diagram.textContent = code.textContent.trim();
        const viewport = document.createElement("div");
        viewport.className = "mermaid-viewport";
        viewport.appendChild(diagram);
        wrap.appendChild(viewport);
        pre.replaceWith(wrap);
      });
    }

    let mermaidReady = false;
    const RASTER_SCALE = 3;
    const MAX_CANVAS_PIXELS = 16 * 1024 * 1024;

    function diagramBasename(wrap, index) {
      const heading = wrap.previousElementSibling;
      let title = "";
      if (heading && /^H[1-6]$/i.test(heading.tagName)) title = heading.textContent.trim();
      if (!title) title = "diagram-" + index;
      return (title || "diagram")
        .replace(/[\\/:*?"<>|]+/g, "-")
        .replace(/\s+/g, "-")
        .replace(/-+/g, "-")
        .replace(/^-|-$/g, "")
        .slice(0, 80) || ("diagram-" + index);
    }

    function pickSafeScale(w, h) {
      for (let s = RASTER_SCALE; s >= 1; s--) {
        if (w * s * h * s <= MAX_CANVAS_PIXELS) return s;
      }
      return 1;
    }

    function getSvgMetrics(svg) {
      const vb = svg.viewBox && svg.viewBox.baseVal;
      let w = vb && vb.width ? vb.width : 0;
      let h = vb && vb.height ? vb.height : 0;
      if (!w || !h) {
        try {
          const box = svg.getBBox();
          w = w || box.width;
          h = h || box.height;
        } catch (_) { /* ignore */ }
      }
      if (!w || !h) {
        const rect = svg.getBoundingClientRect();
        w = w || rect.width || parseFloat(svg.getAttribute("width")) || 800;
        h = h || rect.height || parseFloat(svg.getAttribute("height")) || 600;
      }
      return { width: Math.ceil(w), height: Math.ceil(h) };
    }

    function serializeMermaidSvg(svg, scale) {
      scale = scale || 1;
      const clone = svg.cloneNode(true);
      const { width, height } = getSvgMetrics(svg);
      clone.setAttribute("width", String(width * scale));
      clone.setAttribute("height", String(height * scale));
      if (!clone.getAttribute("viewBox") && width && height) {
        clone.setAttribute("viewBox", `0 0 ${width} ${height}`);
      }
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      if (!clone.getAttribute("xmlns:xlink")) {
        clone.setAttribute("xmlns:xlink", "http://www.w3.org/1999/xlink");
      }
      // 去掉交互态缩放，导出按矢量真实尺寸
      clone.style.maxWidth = "none";
      clone.style.width = (width * scale) + "px";
      clone.style.height = (height * scale) + "px";

      const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
      style.textContent = `
        svg { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; background: #ffffff; }
        .nodeLabel, .edgeLabel, .label, text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      `;
      clone.insertBefore(style, clone.firstChild);

      const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
      bg.setAttribute("width", "100%");
      bg.setAttribute("height", "100%");
      bg.setAttribute("fill", "#ffffff");
      clone.insertBefore(bg, style.nextSibling);

      return {
        svgString: new XMLSerializer().serializeToString(clone),
        width: width * scale,
        height: height * scale
      };
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    function downloadSvg(svg, filename) {
      const data = serializeMermaidSvg(svg, 1);
      const blob = new Blob([data.svgString], { type: "image/svg+xml;charset=utf-8" });
      triggerDownload(blob, filename.endsWith(".svg") ? filename : filename + ".svg");
    }

    function downloadPngHd(svg, filename) {
      const { width, height } = getSvgMetrics(svg);
      const scale = pickSafeScale(width, height);
      const data = serializeMermaidSvg(svg, scale);
      const svgBlob = new Blob([data.svgString], { type: "image/svg+xml;charset=utf-8" });
      const svgUrl = URL.createObjectURL(svgBlob);
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = data.width;
            canvas.height = data.height;
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(svgUrl);
            canvas.toBlob(blob => {
              if (!blob) { reject(new Error("PNG 生成失败")); return; }
              triggerDownload(blob, (filename.endsWith(".png") ? filename : filename + ".png"));
              resolve({ scale, width: data.width, height: data.height });
            }, "image/png");
          } catch (err) {
            URL.revokeObjectURL(svgUrl);
            reject(err);
          }
        };
        img.onerror = () => {
          URL.revokeObjectURL(svgUrl);
          reject(new Error("SVG 栅格化失败（若图含复杂 HTML 标签，请改下 SVG）"));
        };
        img.src = svgUrl;
      });
    }

    function ensureLightbox() {
      let lb = document.getElementById("mermaidLightbox");
      if (lb) return lb;
      lb = document.createElement("div");
      lb.id = "mermaidLightbox";
      lb.className = "mermaid-lightbox";
      lb.innerHTML = `
        <div class="lb-bar">
          <span id="lbTitle">流程图预览</span>
          <div class="lb-actions">
            <button type="button" data-lb="png">下载 PNG 高清</button>
            <button type="button" data-lb="svg">下载 SVG</button>
            <button type="button" data-lb="close">关闭 · Esc</button>
          </div>
        </div>
        <div class="lb-stage" id="lbStage"></div>`;
      document.body.appendChild(lb);
      lb.addEventListener("click", e => {
        if (e.target === lb) closeLightbox();
      });
      document.addEventListener("keydown", e => {
        if (e.key === "Escape" && lb.classList.contains("open")) closeLightbox();
      });
      return lb;
    }

    let lightboxSvg = null;
    let lightboxName = "diagram";

    function openLightbox(svg, title, basename) {
      const lb = ensureLightbox();
      const stage = document.getElementById("lbStage");
      document.getElementById("lbTitle").textContent = title || "流程图预览";
      stage.innerHTML = "";
      const clone = svg.cloneNode(true);
      clone.style.maxWidth = "none";
      stage.appendChild(clone);
      lightboxSvg = svg;
      lightboxName = basename;
      lb.classList.add("open");
      lb.querySelector('[data-lb="png"]').onclick = async () => {
        const btn = lb.querySelector('[data-lb="png"]');
        btn.disabled = true;
        try { await downloadPngHd(lightboxSvg, lightboxName + "-hd"); }
        catch (err) { alert(err.message || String(err)); }
        finally { btn.disabled = false; }
      };
      lb.querySelector('[data-lb="svg"]').onclick = () => downloadSvg(lightboxSvg, lightboxName);
      lb.querySelector('[data-lb="close"]').onclick = closeLightbox;
    }

    function closeLightbox() {
      const lb = document.getElementById("mermaidLightbox");
      if (lb) lb.classList.remove("open");
      lightboxSvg = null;
    }

    function attachMermaidToolbars(root) {
      root.querySelectorAll(".mermaid-wrap").forEach((wrap, i) => {
        if (wrap.querySelector(".mermaid-toolbar")) return;
        const svg = wrap.querySelector("svg");
        if (!svg) return;
        const index = i + 1;
        const basename = diagramBasename(wrap, index);
        const metrics = getSvgMetrics(svg);
        const toolbar = document.createElement("div");
        toolbar.className = "mermaid-toolbar";
        toolbar.innerHTML = `
          <span class="mermaid-title">图 ${index} · ${basename}</span>
          <div class="mermaid-actions">
            <button type="button" data-act="zoom">放大查看</button>
            <button type="button" data-act="svg">下载 SVG</button>
            <button type="button" class="primary" data-act="png">下载 PNG 高清 ×${RASTER_SCALE}</button>
          </div>`;
        const hint = document.createElement("span");
        hint.style.cssText = "display:block;width:100%;font-size:11px;color:#94a3b8;margin-top:2px";
        hint.textContent = `矢量尺寸约 ${metrics.width}×${metrics.height}px · 可横向滚动；PNG 按 ${RASTER_SCALE}× 栅格化`;
        toolbar.appendChild(hint);

        const viewport = wrap.querySelector(".mermaid-viewport") || wrap;
        wrap.insertBefore(toolbar, viewport);

        toolbar.querySelector('[data-act="zoom"]').onclick = () =>
          openLightbox(svg, `图 ${index} · ${basename}`, basename);
        toolbar.querySelector('[data-act="svg"]').onclick = () =>
          downloadSvg(svg, basename);
        toolbar.querySelector('[data-act="png"]').onclick = async (ev) => {
          const btn = ev.currentTarget;
          const old = btn.textContent;
          btn.disabled = true;
          btn.textContent = "生成中…";
          try {
            const r = await downloadPngHd(svg, basename + "-hd");
            btn.textContent = `已下载 ${r.width}×${r.height}`;
            setTimeout(() => { btn.textContent = old; }, 1600);
          } catch (err) {
            alert("高清 PNG 导出失败：" + (err.message || err) + "\n可改下「下载 SVG」后用本地工具转 PNG。");
            btn.textContent = old;
          } finally {
            btn.disabled = false;
          }
        };
      });
    }

    async function renderMermaidDiagrams(root) {
      const nodes = root.querySelectorAll(".mermaid");
      if (!nodes.length || typeof mermaid === "undefined") return;
      if (!mermaidReady) {
        mermaid.initialize({
          startOnLoad: false,
          theme: "base",
          themeVariables: {
            primaryColor: "#ecfdf5",
            primaryTextColor: "#17212b",
            primaryBorderColor: "#0d9488",
            lineColor: "#5b6b7a",
            secondaryColor: "#f0fdfa",
            tertiaryColor: "#f8fafc",
            fontFamily: '"Microsoft YaHei", "PingFang SC", Arial, sans-serif'
          },
          /* useMaxWidth:false → 保留图原始宽度，避免压成一团看不清；htmlLabels:false → PNG 栅格化更稳 */
          flowchart: { useMaxWidth: false, htmlLabels: false, curve: "basis" },
          sequence: { useMaxWidth: false, wrap: true },
          state: { useMaxWidth: false },
          er: { useMaxWidth: false },
          gantt: { useMaxWidth: false },
          securityLevel: "loose"
        });
        mermaidReady = true;
      }
      try {
        await mermaid.run({ nodes: Array.from(nodes), suppressErrors: true });
        attachMermaidToolbars(root);
      } catch (err) {
        nodes.forEach(node => {
          if (node.querySelector("svg")) return;
          const errDiv = document.createElement("div");
          errDiv.className = "mermaid-error";
          errDiv.textContent = "流程图渲染失败，请检查 Mermaid 语法。";
          node.closest(".mermaid-wrap")?.appendChild(errDiv);
        });
        attachMermaidToolbars(root);
        console.error("mermaid", err);
      }
    }

    function renderNav(activeFile) {
      const nav = document.getElementById("docNav");
      nav.innerHTML = DOC_GROUPS.map(g => `
        <div class="doc-group">
          <h2>${g.title}</h2>
          <div class="doc-list">
            ${g.items.map(it => `
              <button type="button" class="${it.file === activeFile ? "active" : ""}" data-doc="${it.file}">${it.label}</button>
            `).join("")}
          </div>
        </div>`).join("");
      nav.querySelectorAll("[data-doc]").forEach(btn => {
        btn.onclick = () => loadDoc(btn.dataset.doc, true);
      });
    }

    async function loadDoc(file, pushHash, anchor) {
      const content = document.getElementById("content");
      const status = document.getElementById("loadStatus");
      currentDocFile = file;
      const label = allDocs().find(d => d.file === file)?.label || file;
      document.getElementById("currentFile").textContent = label;
      content.className = "md loading";
      content.textContent = "加载中…";
      status.textContent = "";
      renderNav(file);
      if (pushHash) setDocHash(file, anchor || "", true);
      else if (anchor) setDocHash(file, anchor, false);

      if (location.protocol === "file:") {
        content.className = "md error";
        content.innerHTML = `<p><strong>无法通过本地文件路径打开文档。</strong></p>
          <p>请在项目目录执行 <code>python3 main.py</code>，然后访问：</p>
          <ul>
            <li><a href="http://127.0.0.1:8766/prototype/docs/index.html">http://127.0.0.1:8766/prototype/docs/index.html</a>（推荐）</li>
          </ul>`;
        return;
      }
      if (typeof marked === "undefined") {
        content.className = "md error";
        content.innerHTML = `<p>Markdown 渲染库未加载，请确认 <code>vendor/marked.min.js</code> 存在，并通过 <code>python3 main.py</code> 访问。</p>`;
        return;
      }

      try {
        const url = docFileUrl(file);
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status + " · " + url);
        const md = await res.text();
        if (!md.trim()) throw new Error("文档为空，请执行 ./scripts/sync-pages.sh 或重启 python3 main.py");
        if (md.trim().startsWith("<!") || md.includes("<html")) {
          throw new Error("返回了 HTML 而非 Markdown，请通过 http://127.0.0.1:8766/prototype/docs/index.html 打开");
        }
        content.className = "md";
        content.innerHTML = marked.parse(md, { gfm: true, breaks: false });
        addHeadingIds(content);
        prepareMermaidBlocks(content);
        await renderMermaidDiagrams(content);
        scrollToAnchor(content, anchor);
        status.textContent = file;
      } catch (e) {
        content.className = "md error";
        content.innerHTML = `<p>无法加载 <code>${file}</code>（${e.message}）。</p>
          <ol>
            <li>已执行 <code>cd 原型/外卖 && python3 main.py</code></li>
            <li>访问 <a href="http://127.0.0.1:8766/prototype/docs/index.html">/prototype/docs/index.html</a>（勿直接双击 html）</li>
            <li>若文档为空，执行 <code>./scripts/sync-pages.sh</code></li>
          </ol>`;
      }
    }

    const contentEl = document.getElementById("content");
    contentEl.addEventListener("click", e => {
      const a = e.target.closest("a");
      if (!a || !contentEl.contains(a)) return;
      const resolved = resolveDocLink(a.getAttribute("href"), currentDocFile);
      if (!resolved) return;
      if (resolved.broken) {
        e.preventDefault();
        alert("该链接指向本地/仓库外文件，请查阅仓库内对应 PRD 与差异清单。");
        return;
      }
      e.preventDefault();
      loadDoc(resolved.file, true, resolved.anchor);
    });

    const fileFromQuery = parseFileQuery();
    const { file: hashFile, anchor: initialAnchor } = parseLocationHash();
    const initialFile = fileFromQuery || (hashFile.endsWith(".md") ? hashFile : "PRD.md");
    loadDoc(initialFile, !fileFromQuery, initialAnchor);
    if (fileFromQuery) {
      history.replaceState(null, "", "?file=" + encodeURIComponent(fileFromQuery) + (initialAnchor ? "#" + initialAnchor : ""));
      setDocHash(fileFromQuery, initialAnchor || "", false);
    }
    window.addEventListener("hashchange", () => {
      const { file, anchor } = parseLocationHash();
      if (file && file.endsWith(".md")) loadDoc(file, false, anchor);
    });
  </script>
</body>
</html>
